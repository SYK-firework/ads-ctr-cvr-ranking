# KServe deployment for the scoring server (Standard / raw deployment mode).
# CPU and memory limits are set on purpose: an unbounded pod under load starved the kind control
# plane in an earlier run. Autoscaling: 1-3 replicas at 70% of the CPU request.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: adsrank
  annotations:
    serving.kserve.io/autoscalerClass: hpa
    serving.kserve.io/metric: cpu
    serving.kserve.io/targetUtilizationPercentage: "70"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    containers:
      - name: kserve-container
        image: adsrank-serving:v1
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
            protocol: TCP
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
        resources:
          requests: { cpu: "500m", memory: "256Mi" }
          limits: { cpu: "1", memory: "512Mi" }
