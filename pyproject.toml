[project]
name = "adsrank"
version = "0.1.0"
description = "CTR / CVR prediction and ad ranking on Criteo public datasets"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "xgboost",
    "matplotlib",
]

[project.optional-dependencies]
tracking = ["mlflow"]
data = ["datasets"]
nn = ["torch"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
