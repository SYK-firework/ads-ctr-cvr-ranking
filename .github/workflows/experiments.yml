# Reproducible experiment runs on a GitHub-hosted runner (4 vCPU, 16 GB on ubuntu-latest).
# Started by hand: Actions tab -> experiments -> Run workflow, or `gh workflow run experiments`.
#
#   drift  : download Criteo Attribution rows -> calibrate -> daily drift report
#   airflow: the retraining DAG (dags/adsrank_retrain.py) run end to end by `airflow dags test`
#            against a kind + KServe cluster with a stable model already deployed
#   canary : export serving model (skew check) -> kind + KServe (Standard mode) -> deploy stable ->
#            canary with the same model (expect promote) -> canary with a broken model (expect rollback)
#
# Results are uploaded as workflow artifacts. Latency here is the runner's, not the laptop's.
name: experiments

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Criteo Attribution rows
        default: "2000000"
      canary:
        description: run the canary job
        type: boolean
        default: true
      airflow:
        description: run the Airflow DAG end to end against a kind + KServe cluster
        type: boolean
        default: false

defaults:
  run:
    shell: bash          # -eo pipefail, so `make ... | tee` fails when make fails

env:
  ROWS: ${{ inputs.rows }}
  KSERVE_VERSION: v0.17.0
  CERT_MANAGER_VERSION: v1.16.2

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[data,dev]"
      - uses: actions/cache@v4
        id: data
        with:
          path: data/attribution_${{ inputs.rows }}.parquet
          key: attribution-${{ inputs.rows }}
      - if: steps.data.outputs.cache-hit != 'true'
        run: make data-attribution ATTR_ROWS=$ROWS
      - run: make calibrate ATTR_ROWS=$ROWS 2>&1 | tee results/calibrate.log
      - run: make drift 2>&1 | tee results/drift.log
      - name: Retraining decision on this drift report (what the Airflow DAG's branch would do)
        run: python -m adsrank.pipeline results/drift.json | tee results/retrain_decision.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift
          path: |
            results/drift.*
            results/calibration.json
            results/calibrate.log
            results/retrain_decision.json

  two-tower:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,dev]"
      - uses: actions/cache@v4
        id: data
        with:
          path: data/attribution_${{ inputs.rows }}.parquet
          key: attribution-${{ inputs.rows }}
      - if: steps.data.outputs.cache-hit != 'true'
        run: make data-attribution ATTR_ROWS=$ROWS
      - run: make two-tower ATTR_ROWS=$ROWS 2>&1 | tee results/two_tower.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-tower
          path: results/two_tower.*

  canary:
    if: ${{ inputs.canary }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[data,serving,dev]"
      - uses: actions/cache@v4
        id: data
        with:
          path: data/attribution_${{ inputs.rows }}.parquet
          key: attribution-${{ inputs.rows }}
      - if: steps.data.outputs.cache-hit != 'true'
        run: make data-attribution ATTR_ROWS=$ROWS
      - name: Export serving model (fails on training-serving skew)
        run: make export ATTR_ROWS=$ROWS

      - uses: helm/kind-action@v1
        with: { cluster_name: mlp }
      - name: Install cert-manager and KServe (Standard / raw deployment mode)
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/$CERT_MANAGER_VERSION/cert-manager.yaml
          kubectl wait --for=condition=Available deploy --all -n cert-manager --timeout=300s
          helm install kserve-crd oci://ghcr.io/kserve/charts/kserve-crd --version $KSERVE_VERSION \
            --namespace kserve --create-namespace
          helm install kserve-resources oci://ghcr.io/kserve/charts/kserve-resources --version $KSERVE_VERSION \
            --namespace kserve \
            --set kserve.controller.deploymentMode=Standard \
            --set kserve.controller.gateway.disableIngressCreation=true \
            --wait --timeout 10m

      - name: Deploy stable (v1)
        run: make image deploy IMAGE=adsrank-serving:v1

      - name: Canary with the same model (expect promote)
        run: |
          mkdir -p results
          make canary-image CANARY_IMAGE=adsrank-serving:v2
          bash scripts/canary_rollout.sh adsrank-serving:v2 2>&1 | tee results/canary_good.log

      - name: Canary with a broken model (expect rollback)
        run: |
          python scripts/break_model.py serving/model
          make canary-image CANARY_IMAGE=adsrank-serving:v3-bad
          set +e
          bash scripts/canary_rollout.sh adsrank-serving:v3-bad 2>&1 | tee results/canary_bad.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then echo "::error::broken model was promoted"; exit 1; fi
          kubectl get isvc adsrank -o jsonpath='{.spec.predictor.containers[0].image}' | grep -q 'adsrank-serving:v2'
          echo "rollback confirmed; stable still on adsrank-serving:v2"

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get isvc,deploy,pods -A || true
          kubectl describe isvc -A | tail -80 || true
          kubectl logs -n kserve deploy/kserve-controller-manager --tail=100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary
          path: results/canary_*.log

  airflow:
    if: ${{ inputs.airflow }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADSRANK_HOME: ${{ github.workspace }}
      ADSRANK_ROWS: ${{ inputs.rows }}
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "apache-airflow" -e ".[data,serving,dev]"
      - uses: actions/cache@v4
        id: data
        with:
          path: data/attribution_${{ inputs.rows }}.parquet
          key: attribution-${{ inputs.rows }}
      - if: steps.data.outputs.cache-hit != 'true'
        run: make data-attribution ATTR_ROWS=$ROWS
      - name: Stable model to roll out against (v1)
        run: make export ATTR_ROWS=$ROWS
      - uses: helm/kind-action@v1
        with: { cluster_name: mlp }
      - name: Install cert-manager and KServe (Standard mode)
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/$CERT_MANAGER_VERSION/cert-manager.yaml
          kubectl wait --for=condition=Available deploy --all -n cert-manager --timeout=300s
          helm install kserve-crd oci://ghcr.io/kserve/charts/kserve-crd --version $KSERVE_VERSION --namespace kserve --create-namespace
          helm install kserve-resources oci://ghcr.io/kserve/charts/kserve-resources --version $KSERVE_VERSION \
            --namespace kserve --set kserve.controller.deploymentMode=Standard \
            --set kserve.controller.gateway.disableIngressCreation=true --wait --timeout 10m
      - run: make image deploy IMAGE=adsrank-serving:v1
      - name: Run the DAG (no force: the drift report decides)
        run: |
          airflow db migrate > /dev/null
          airflow version
          airflow dags test adsrank_retrain 2>&1 | tee results/airflow_dag_test.log
      - name: Outcome
        if: always()
        run: |
          grep -E "retrain|reasons|Marking task as|state=|Task instance .* (success|failed|skipped)|decision:|promote|rollback|canary +[0-9]+%" results/airflow_dag_test.log | tail -60 || true
          echo "stable image now: $(kubectl get isvc adsrank -o jsonpath='{.spec.predictor.containers[0].image}')"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: airflow, path: results/airflow_dag_test.log }
