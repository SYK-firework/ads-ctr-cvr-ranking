# Daily retraining run: the Airflow DAG (dags/adsrank_retrain.py) on a fresh kind + KServe cluster.
#
# GitHub runners are ephemeral, so the state that must survive between days is the serving image:
#   - start of the run: pull ghcr.io/<owner>/adsrank-serving:stable (yesterday's promoted model)
#     and deploy it as stable; on the very first run, build it from the current code instead
#   - the DAG decides from the drift report whether to retrain; if the canary promotes a new image,
#     it is pushed as :stable (and a dated tag) for tomorrow; a rollback leaves :stable unchanged
# The run summary records the decision and the outcome. Caveat: every run uses the same first 2M
# Criteo rows, so this demonstrates the scheduled loop, not a changing data stream.
name: daily

on:
  schedule:
    - cron: "17 9 * * *"          # 09:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

env:
  ROWS: "2000000"
  KSERVE_VERSION: v0.17.0
  CERT_MANAGER_VERSION: v1.16.2
  ADSRANK_ROWS: "2000000"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Paths and registry name
        run: |
          echo "ADSRANK_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "AIRFLOW_HOME=$GITHUB_WORKSPACE/.airflow" >> $GITHUB_ENV
          echo "AIRFLOW__CORE__DAGS_FOLDER=$GITHUB_WORKSPACE/dags" >> $GITHUB_ENV
          echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/adsrank-serving" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "apache-airflow" -e ".[data,serving,dev]"
      - uses: actions/cache@v4
        id: data
        with: { path: data/attribution_2000000.parquet, key: attribution-2000000 }
      - if: steps.data.outputs.cache-hit != 'true'
        run: make data-attribution ATTR_ROWS=$ROWS
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Stable image (yesterday's promoted model, or build on the first run)
        run: |
          if docker pull "$REGISTRY:stable"; then
            docker tag "$REGISTRY:stable" adsrank-serving:v1
            echo "STABLE_SOURCE=registry ($(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY:stable"))" >> $GITHUB_ENV
          else
            make export ATTR_ROWS=$ROWS
            docker build -f serving/Dockerfile -t adsrank-serving:v1 .
            docker tag adsrank-serving:v1 "$REGISTRY:stable" && docker push "$REGISTRY:stable"
            echo "STABLE_SOURCE=built (first run)" >> $GITHUB_ENV
          fi
      - uses: helm/kind-action@v1
        with: { cluster_name: mlp }
      - name: Install cert-manager and KServe (Standard mode)
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/$CERT_MANAGER_VERSION/cert-manager.yaml
          kubectl wait --for=condition=Available deploy --all -n cert-manager --timeout=300s
          helm install kserve-crd oci://ghcr.io/kserve/charts/kserve-crd --version $KSERVE_VERSION --namespace kserve --create-namespace
          helm install kserve-resources oci://ghcr.io/kserve/charts/kserve-resources --version $KSERVE_VERSION \
            --namespace kserve --set kserve.controller.deploymentMode=Standard \
            --set kserve.controller.gateway.disableIngressCreation=true --wait --timeout 10m
      - name: Deploy stable
        run: |
          kind load docker-image adsrank-serving:v1 --name mlp
          make deploy
      - name: "Run the DAG (the drift report decides)"
        run: |
          airflow db migrate > /dev/null
          set +e
          airflow dags test adsrank_retrain 2>&1 | tee dag.log
          echo "DAG_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV
      - name: Publish the promoted image and write the run summary
        if: always()
        run: |
          now=$(kubectl get isvc adsrank -o jsonpath='{.spec.predictor.containers[0].image}' 2>/dev/null || echo unknown)
          decision=$(grep -o '"retrain": [a-z]*' dag.log | head -1 || true)
          if [ "$now" != "adsrank-serving:v1" ] && [ "$now" != "unknown" ]; then
            outcome="promoted $now"
            docker tag "$now" "$REGISTRY:stable"
            docker tag "$now" "$REGISTRY:$(date -u +%Y%m%d)"
            docker push "$REGISTRY:stable" && docker push "$REGISTRY:$(date -u +%Y%m%d)"
          elif grep -q "Skipping tasks \[('export_with_skew_check'" dag.log; then
            outcome="no retrain needed; stable unchanged"
          else
            outcome="no promotion (rollback or failure); stable unchanged"
          fi
          {
            echo "## Daily retraining run $(date -u +%Y-%m-%d)"
            echo "- stable at start: $STABLE_SOURCE"
            echo "- decision: ${decision:-unknown}"
            grep -o 'canary  *[0-9]*%: [a-z]* .*' dag.log | sed 's/ \[airflow.*//; s/^/- /' || true
            echo "- outcome: $outcome"
            echo "- DAG exit code: ${DAG_EXIT:-unknown}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${DAG_EXIT:-1}" = "0" ]
